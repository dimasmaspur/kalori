<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalori</title>
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Catat kalori harian dengan foto + AI Gemini">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Kalori</h1>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" data-action="open-add" aria-label="Tambah makanan">+</button>

  <nav class="tabs">
    <button data-tab="today" class="active"><span>🍽️</span>Hari ini</button>
    <button data-tab="history"><span>📊</span>Riwayat</button>
    <button data-tab="profile"><span>⚙️</span>Pengaturan</button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="gallery-input" accept="image/*" hidden>
  <input type="file" id="import-input" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
