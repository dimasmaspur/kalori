<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kaloree</title>
  <meta name="theme-color" content="#fff3e4">
  <meta name="description" content="Catat kalori harian dengan foto + AI Gemini">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Kaloree</h1>
    <div id="top-right"></div>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" data-action="open-add" aria-label="Tambah makanan"></button>

  <nav class="tabs" id="tabs"></nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="gallery-input" accept="image/*" hidden>
  <input type="file" id="import-input" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
